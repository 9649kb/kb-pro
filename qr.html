<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KB Pro</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;color:#0D1B3E;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;text-align:center;padding:24px;}
  .box{max-width:420px;}
  a.btn{display:inline-block;background:#1E7FFF;color:#fff;padding:12px 26px;border-radius:30px;text-decoration:none;font-weight:700;margin-top:16px;}
  p{font-size:14px;line-height:1.6;opacity:.85;color:#333;}
  h1{font-size:20px;margin-bottom:8px;}
</style>
</head>
<body>
<div class="box" id="box"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
var FB_CONFIG={apiKey:"AIzaSyDJK6QsiPyFk0JB7emCEycsh7tHU_x4Qw4",authDomain:"kb-pro-abdac.firebaseapp.com",projectId:"kb-pro-abdac",storageBucket:"kb-pro-abdac.firebasestorage.app",messagingSenderId:"191917083655",appId:"1:191917083655:web:7459a5b1c70e77bac9eea2"};

function showBox(html){document.getElementById('box').innerHTML=html;}

function showError(title,msg){
  showBox('<h1>'+title+'</h1><p>'+msg+'</p><a class="btn" href="/">Aller sur le site KB Pro</a>');
}

async function run(){
  var params=new URLSearchParams(window.location.search);
  var code=params.get('qr');
  if(!code){
    window.location.replace('/');
    return;
  }
  try{
    if(!firebase.apps.length)firebase.initializeApp(FB_CONFIG);
    var db=firebase.firestore();
    var ref=db.collection('qr_dynamiques').doc(code);
    var snap=await ref.get();
    if(!snap.exists){
      showError('❌ QR introuvable','Ce code n\'existe pas ou a été supprimé.');
      return;
    }
    var q=snap.data();
    ref.update({scans:(q.scans||0)+1,lastScan:new Date().toISOString()}).catch(function(){});
    if(!q.actif){
      showError('⏸ Indisponible','Ce QR a été désactivé temporairement.');
      return;
    }
    var c=q.content||{};
    if(q.type==='lien'&&c.url){
      var url=c.url.match(/^https?:\/\//)?c.url:'https://'+c.url;
      window.location.replace(url);
      return;
    }
    if(q.type==='whatsapp'&&c.tel){
      var tel=c.tel.replace(/[\s\-()]/g,'').replace('+','');
      window.location.replace('https://wa.me/'+tel+(c.msg?'?text='+encodeURIComponent(c.msg):''));
      return;
    }
    if(q.type==='vcard'){
      var vcard=['BEGIN:VCARD','VERSION:3.0','FN:'+(c.nom||''),c.tel?'TEL;TYPE=CELL:'+c.tel:'',c.adresse?'ADR:;;'+c.adresse+';;;;Togo':'','END:VCARD'].filter(Boolean).join('\r\n');
      var blob=new Blob([vcard],{type:'text/vcard'});
      var dlUrl=URL.createObjectURL(blob);
      showBox('<h1>'+(c.nom||'Contact')+'</h1><p>'+(c.tel||'')+(c.adresse?' · '+c.adresse:'')+'</p><a class="btn" href="'+dlUrl+'" download="'+(c.nom||'contact').replace(/[^a-zA-Z0-9]/g,'_')+'.vcf">💾 Enregistrer le contact</a>');
      return;
    }
    showBox('<p style="font-size:16px;white-space:pre-wrap">'+(c.texte||'')+'</p>');
  }catch(e){
    console.warn('qr redirect error:',e);
    showError('⚠️ Connexion impossible','Vérifie ta connexion internet et réessaie de scanner.');
  }
}
run();
</script>
</body>
</html>
